x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  TEXT_ENCRYPTION_KEY: ${TEXT_ENCRYPTION_KEY:?Set TEXT_ENCRYPTION_KEY in .env}

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Only this computer can connect (for pytest and alembic), not the network.
      - "127.0.0.1:5433:5432"
    healthcheck:
      # $$ makes Compose pass a literal $ so the shell inside the container
      # expands the variable, using the container's own environment.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # No "ports": Redis is reachable only by the other containers.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies the database migrations, then exits.
  migrate:
    build: .
    command: alembic upgrade head
    environment: *app-environment
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: fastapi run app/main.py --port 8000 --host 0.0.0.0
    environment: *app-environment
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment: *app-environment
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
